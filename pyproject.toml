[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "granite"
version = "0.0.1"
authors = [
    {name = "anoymous", email = "anoymous@mail.com"},
]
description = "Generalized Regional frAmework for ideNtIfying agreemenT in feature-based Explanation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  'graphviz',
  'numpy>=2.0.0',
  'matplotlib>=3.7',
  'pandas>=2.0.0',
  'scikit-learn>=1.5.0',
  'ipykernel>=6.9.0',
  'tqdm>=4.27.0',
  'shap',
  'xgboost',
  'interpret-core',
  'omegaconf',
  "shapiq>=1.3.1",
  "overrides",
  "seaborn",
  "simple_parsing"
]

[tool.setuptools]
packages = [
  "granite",
  "granite.tree_shap"
]

[project.optional-dependencies]
test = ["pytest"]
dev = ["mypy", "black", "flake8"]

[[tool.mypy.overrides]]
module = ['pandas.*', 'sklearn.*', 'joblib', 'scipy.*']
ignore_missing_imports = true

[tool.black]
line-length = 88

